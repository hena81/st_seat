<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - لوحة التحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] },
                    animation: {
                        'fade-in': 'fadeIn 0.6s ease-out',
                        'slide-up': 'slideUp 0.6s ease-out',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(30px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Cairo', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 30%, #0f172a 60%, #1e3a5f 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .bg-mesh {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;
            background-image:
                radial-gradient(at 20% 30%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 80% 70%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
        }
        .input-field:focus { box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25); }
        .btn-login {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body class="font-cairo text-white flex items-center justify-center min-h-screen p-4">
    <div class="bg-mesh"></div>

    <div class="relative z-10 w-full max-w-md animate-slide-up">
        <!-- Back to Home -->
        <a href="/" class="inline-flex items-center gap-2 text-slate-400 hover:text-white transition-colors mb-6 text-sm">
            <i class="fas fa-arrow-right"></i>
            <span>العودة للصفحة الرئيسية</span>
        </a>

        <div class="glass-card rounded-3xl p-8 md:p-10">
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="w-20 h-20 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center shadow-lg shadow-blue-500/25">
                    <i class="fas fa-shield-halved text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-white mb-1">تسجيل الدخول</h1>
                <p class="text-slate-400 text-sm">لوحة تحكم المسؤول</p>
            </div>

            <!-- Alert -->
            <div id="loginAlert" class="hidden mb-4 p-4 rounded-2xl text-sm"></div>

            <!-- Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="space-y-4">
                    <!-- Username -->
                    <div>
                        <label class="block text-sm text-slate-300 mb-2 font-medium">اسم المستخدم</label>
                        <div class="relative">
                            <i class="fas fa-user absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input id="username" type="text" required
                                   class="input-field w-full bg-white/5 border border-white/10 rounded-xl py-3.5 pr-11 pl-4 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500/50 transition-all"
                                   placeholder="أدخل اسم المستخدم">
                        </div>
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="block text-sm text-slate-300 mb-2 font-medium">كلمة المرور</label>
                        <div class="relative">
                            <i class="fas fa-lock absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input id="password" type="password" required
                                   class="input-field w-full bg-white/5 border border-white/10 rounded-xl py-3.5 pr-11 pl-4 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500/50 transition-all"
                                   placeholder="أدخل كلمة المرور">
                            <button type="button" onclick="togglePasswordVisibility()" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition-colors">
                                <i id="eyeIcon" class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit" id="loginBtn"
                        class="btn-login w-full text-white font-semibold py-3.5 px-6 rounded-xl text-lg mt-6 flex items-center justify-center gap-2">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>تسجيل الدخول</span>
                </button>
            </form>
        </div>

        <!-- Info -->
        <p class="text-center text-slate-500 text-xs mt-6">
            الدخول لأفراد الإدارة فقط
        </p>
    </div>

    <script>
        function showAlert(msg, type) {
            const alert = document.getElementById('loginAlert');
            alert.className = 'mb-4 p-4 rounded-2xl text-sm';
            if (type === 'error') {
                alert.classList.add('bg-red-500/10', 'border', 'border-red-500/20', 'text-red-300');
            } else {
                alert.classList.add('bg-green-500/10', 'border', 'border-green-500/20', 'text-green-300');
            }
            alert.innerHTML = `<i class="fas fa-${type === 'error' ? 'exclamation-circle' : 'check-circle'} ml-2"></i>${msg}`;
            alert.classList.remove('hidden');
        }

        function togglePasswordVisibility() {
            const passInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passInput.type = 'password';
                eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div><span>جاري الدخول...</span>';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    showAlert('تم تسجيل الدخول بنجاح', 'success');
                    setTimeout(() => window.location.href = '/admin', 800);
                } else {
                    showAlert(data.error, 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>تسجيل الدخول</span>';
                }
            } catch (err) {
                showAlert('خطأ في الاتصال بالخادم', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>تسجيل الدخول</span>';
            }
        }

        // Check if already logged in
        fetch('/api/auth-status').then(r => r.json()).then(data => {
            if (data.isAuthenticated) window.location.href = '/admin';
        });
    </script>
</body>
</html>
