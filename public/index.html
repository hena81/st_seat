<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الاستعلام عن أرقام الجلوس</title>
    <meta name="description" content="نظام الاستعلام عن أرقام الجلوس واللجان الامتحانية للطلاب">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] },
                    colors: {
                        primary: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a' },
                        accent: { 400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed' },
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-up': 'slideUp 0.5s ease-out',
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-slow': 'pulse 3s ease-in-out infinite',
                        'shimmer': 'shimmer 2s linear infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(30px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        float: { '0%, 100%': { transform: 'translateY(0px)' }, '50%': { transform: 'translateY(-20px)' } },
                        shimmer: { '0%': { backgroundPosition: '-200% 0' }, '100%': { backgroundPosition: '200% 0' } },
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Cairo', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 30%, #0f172a 60%, #1e3a5f 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .search-glow {
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.15), 0 0 60px rgba(139, 92, 246, 0.08);
        }
        .result-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.03) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .result-card:hover {
            transform: translateY(-4px);
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 30px rgba(59, 130, 246, 0.1);
        }
        .info-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
        }
        .info-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(59, 130, 246, 0.3);
        }
        .bg-mesh {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;
            background-image:
                radial-gradient(at 10% 20%, rgba(59, 130, 246, 0.12) 0px, transparent 60%),
                radial-gradient(at 90% 80%, rgba(139, 92, 246, 0.1) 0px, transparent 60%),
                radial-gradient(at 50% 50%, rgba(6, 182, 212, 0.08) 0px, transparent 60%);
        }
        .search-input:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25), 0 0 40px rgba(59, 130, 246, 0.1);
        }
        .btn-search {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            transition: all 0.3s ease;
        }
        .btn-search:hover {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }
        .btn-search:active { transform: translateY(0); }
        .logo-container {
            filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.3));
        }
        @keyframes particle {
            0% { transform: translateY(0) rotate(0); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }
        .particle {
            position: fixed; bottom: -10px; width: 6px; height: 6px;
            background: rgba(59, 130, 246, 0.3); border-radius: 50%;
            animation: particle linear infinite; pointer-events: none; z-index: 0;
        }
        .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.04) 75%); background-size: 200% 100%; animation: shimmer 2s linear infinite; }
    </style>
</head>
<body class="font-cairo text-white overflow-x-hidden">
    <!-- Background Mesh -->
    <div class="bg-mesh"></div>

    <!-- Particles -->
    <div id="particles"></div>

    <!-- Main Content -->
    <div class="relative z-10 min-h-screen flex flex-col">
        <!-- Top Navigation -->
        <div class="w-full px-4 sm:px-8 pt-4 sm:pt-6 flex justify-between items-center z-20">
            <!-- About Project Link -->
            <a href="/about"
               class="inline-flex items-center gap-2 px-3.5 py-2 sm:px-4 sm:py-2.5 rounded-2xl text-xs sm:text-sm font-semibold text-slate-200 hover:text-white bg-white/5 hover:bg-white/10 border border-white/10 hover:border-cyan-400/50 transition-all duration-300 backdrop-blur-md shadow-lg shadow-black/20 group"
               title="عن المشروع ودليل الاستخدام">
                <i class="fas fa-book-open text-cyan-400 group-hover:text-cyan-300 text-sm sm:text-base transition-colors"></i>
                <span class="font-bold">عن المشروع ودليل الاستخدام</span>
            </a>

            <!-- Admin Login Button -->
            <a href="/login"
               class="inline-flex items-center gap-2 px-3.5 py-2 sm:px-4 sm:py-2.5 rounded-2xl text-xs sm:text-sm font-medium text-slate-300 hover:text-white bg-white/5 hover:bg-white/10 border border-white/10 hover:border-blue-500/40 transition-all duration-300 backdrop-blur-md shadow-lg shadow-black/20 group"
               title="تسجيل دخول المسؤول">
                <i class="fas fa-right-to-bracket text-blue-400 group-hover:text-blue-300 text-sm sm:text-base transition-colors"></i>
                <span class="hidden sm:inline">تسجيل الدخول</span>
            </a>
        </div>

        <!-- Header -->
        <header class="pt-6 pb-4">
            <div class="container mx-auto px-4 text-center">
                <!-- Logo -->
                <div class="logo-container mb-6 animate-fade-in">
                    <img id="schoolLogo" src="/uploads/logo.png" alt="شعار المدرسة"
                         class="w-28 h-28 mx-auto rounded-2xl object-contain bg-white/10 p-2 animate-float"
                         onerror="this.style.display='none'">
                </div>
                <!-- School Name -->
                <h1 id="schoolName" class="text-3xl md:text-5xl font-bold bg-gradient-to-r from-blue-400 via-purple-400 to-cyan-400 bg-clip-text text-transparent mb-3 animate-slide-up">
                    مدرسة ثانوية عبدالعزيز سعود البابطين
                </h1>
                <!-- Page Text -->
                <p id="pageText" class="text-lg md:text-xl text-slate-300/80 font-light animate-slide-up" style="animation-delay: 0.1s;">
                    نظام الاستعلام عن أرقام الجلوس
                </p>

                <!-- Prominent About CTA Button -->
                <div class="mt-4 flex items-center justify-center animate-slide-up" style="animation-delay: 0.15s;">
                    <a href="/about"
                       class="inline-flex items-center gap-2.5 px-5 py-2.5 rounded-2xl text-sm md:text-base font-bold text-white bg-gradient-to-r from-blue-600/80 via-indigo-600/80 to-purple-600/80 hover:from-blue-500 hover:to-purple-500 border border-white/15 hover:border-white/35 shadow-lg shadow-blue-500/20 hover:shadow-blue-500/35 hover:-translate-y-0.5 transition-all duration-300 backdrop-blur-md group">
                        <i class="fas fa-circle-info text-cyan-300 text-base"></i>
                        <span>عن المشروع ودليل الاستخدام</span>
                        <i class="fas fa-arrow-left text-xs text-slate-300 group-hover:-translate-x-1 transition-transform mr-1"></i>
                    </a>
                </div>
            </div>
        </header>

        <!-- Search Section -->
        <main class="flex-1 flex items-start justify-center px-4 pt-6 pb-12">
            <div class="w-full max-w-2xl">
                <!-- Search Box -->
                <div class="glass-card search-glow rounded-3xl p-6 md:p-8 mb-8 animate-slide-up" style="animation-delay: 0.2s;">
                    <div class="flex flex-col sm:flex-row gap-3">
                        <div class="relative flex-1">
                            <i class="fas fa-search absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input id="searchInput" type="text" placeholder="الرقم المدني   "
                                   class="search-input w-full bg-white/5 border border-white/10 rounded-2xl py-4 pr-12 pl-4 text-white placeholder-slate-400 text-lg focus:outline-none focus:border-blue-500/50 transition-all duration-300"
                                   autocomplete="off">
                        </div>
                        <button id="searchBtn" onclick="searchStudent()"
                                class="btn-search text-white font-semibold py-4 px-8 rounded-2xl text-lg flex items-center justify-center gap-2 min-w-[140px]">
                            <i class="fas fa-search"></i>
                            <span>بحث</span>
                        </button>
                    </div>
                </div>

                <!-- Results Area -->
                <div id="resultsArea" class="space-y-4"></div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="py-6 text-center border-t border-white/5 flex flex-col items-center gap-3">
            <p class="text-slate-500 text-sm">
                <span id="footerSchoolName">مدرسة ثانوية عبدالعزيز سعود البابطين </span> &copy; <span id="currentYear"></span>
            </p>
            <div class="flex items-center gap-4 text-xs">
                <a href="/about" class="inline-flex items-center gap-1.5 text-slate-400 hover:text-cyan-400 transition-colors">
                    <i class="fas fa-book-open text-xs"></i>
                    <span>عن المشروع ودليل الاستخدام</span>
                </a>
                <span class="text-slate-700">•</span>
                <a href="/login" class="inline-flex items-center gap-1.5 text-slate-400 hover:text-blue-400 transition-colors">
                    <i class="fas fa-lock text-xs"></i>
                    <span>تسجيل دخول المسؤول</span>
                </a>
            </div>
        </footer>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (8 + Math.random() * 15) + 's';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.width = (3 + Math.random() * 5) + 'px';
                particle.style.height = particle.style.width;
                particle.style.opacity = 0.1 + Math.random() * 0.3;
                container.appendChild(particle);
            }
        }
        createParticles();

        // Set current year
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        let studentInstructions = '';

        // Load settings
        async function loadSettings() {
            try {
                const res = await fetch('/api/settings');
                const settings = await res.json();
                studentInstructions = (settings.studentInstructions || '').trim();
                if (settings.schoolName) {
                    document.getElementById('schoolName').textContent = settings.schoolName;
                    document.getElementById('footerSchoolName').textContent = settings.schoolName;
                    document.title = settings.schoolName + ' - نظام الاستعلام';
                }
                if (settings.pageText) {
                    document.getElementById('pageText').textContent = settings.pageText;
                }
                if (settings.logoPath) {
                    const logo = document.getElementById('schoolLogo');
                    logo.src = settings.logoPath + '?t=' + Date.now();
                    logo.style.display = '';
                }
            } catch (e) { console.error('Error loading settings:', e); }
        }
        const settingsReady = loadSettings();

        // Search
        async function searchStudent() {
            await settingsReady;
            const query = document.getElementById('searchInput').value.trim();
            const resultsArea = document.getElementById('resultsArea');

            if (!query) {
                resultsArea.innerHTML = `
                    <div class="glass-card rounded-2xl p-6 text-center animate-fade-in">
                        <i class="fas fa-info-circle text-4xl text-blue-400 mb-3"></i>
                        <p class="text-slate-300">يرجى إدخال الرقم المدني   </p>
                    </div>`;
                return;
            }

            // Loading state
            resultsArea.innerHTML = `
                <div class="result-card rounded-2xl p-8">
                    <div class="flex items-center justify-center gap-3">
                        <div class="w-6 h-6 border-2 border-blue-400 border-t-transparent rounded-full animate-spin"></div>
                        <span class="text-slate-300">جاري البحث...</span>
                    </div>
                </div>`;

            try {
                const res = await fetch('/api/search?q=' + encodeURIComponent(query));
                const results = await res.json();

                if (results.length === 0) {
                    resultsArea.innerHTML = `
                        <div class="glass-card rounded-2xl p-8 text-center animate-slide-up">
                            <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-red-500/10 flex items-center justify-center">
                                <i class="fas fa-user-slash text-3xl text-red-400"></i>
                            </div>
                            <h3 class="text-xl font-bold text-white mb-2">لم يتم العثور على نتائج</h3>
                            <p class="text-slate-400">تأكد من صحة الرقم المدني وحاول مرة أخرى</p>
                        </div>`;
                    return;
                }

                resultsArea.innerHTML = results.map((s, index) => `
                    <div class="result-card rounded-3xl p-6 md:p-8 animate-slide-up" style="animation-delay: ${index * 0.1}s;">
                        <!-- Student Name Header -->
                        <div class="flex items-center gap-4 mb-6 pb-5 border-b border-white/10">
                            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center flex-shrink-0 shadow-lg shadow-blue-500/20">
                                <i class="fas fa-user-graduate text-2xl"></i>
                            </div>
                            <div>
                                <h3 class="text-xl md:text-2xl font-bold text-white">${s.studentName || '---'}</h3>
                                <p class="text-sm text-slate-400 mt-0.5">بيانات الطالب</p>
                            </div>
                        </div>
                        <!-- Info Grid -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div class="info-item rounded-2xl p-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-blue-500/15 flex items-center justify-center">
                                        <i class="fas fa-id-card text-blue-400"></i>
                                    </div>
                                    <div>
                                        <p class="text-xs text-slate-400 mb-0.5">الرقم المدني</p>
                                        <p class="font-bold text-white text-lg">${s.civilId || '---'}</p>
                                    </div>
                                </div>
                            </div>
                            <div class="info-item rounded-2xl p-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-purple-500/15 flex items-center justify-center">
                                        <i class="fas fa-hashtag text-purple-400"></i>
                                    </div>
                                    <div>
                                        <p class="text-xs text-slate-400 mb-0.5">رقم الجلوس</p>
                                        <p class="font-bold text-white text-lg">${s.seatNumber || '---'}</p>
                                    </div>
                                </div>
                            </div>
                            <div class="info-item rounded-2xl p-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-cyan-500/15 flex items-center justify-center">
                                        <i class="fas fa-school text-cyan-400"></i>
                                    </div>
                                    <div>
                                        <p class="text-xs text-slate-400 mb-0.5">لجنة مدرسة</p>
                                        <p class="font-bold text-white">${s.schoolCommittee || '---'}</p>
                                    </div>
                                </div>
                            </div>
                            <div class="info-item rounded-2xl p-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-emerald-500/15 flex items-center justify-center">
                                        <i class="fas fa-building text-emerald-400"></i>
                                    </div>
                                    <div>
                                        <p class="text-xs text-slate-400 mb-0.5">اللجنة الرئيسية</p>
                                        <p class="font-bold text-white">${s.mainCommittee || '---'}</p>
                                    </div>
                                </div>
                            </div>
                            <div class="info-item rounded-2xl p-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-amber-500/15 flex items-center justify-center">
                                        <i class="fas fa-door-open text-amber-400"></i>
                                    </div>
                                    <div>
                                        <p class="text-xs text-slate-400 mb-0.5">اللجنة الفرعية</p>
                                        <p class="font-bold text-white">${s.subCommittee || '---'}</p>
                                    </div>
                                </div>
                            </div>
                            <div class="info-item rounded-2xl p-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-rose-500/15 flex items-center justify-center">
                                        <i class="fas fa-map-marker-alt text-rose-400"></i>
                                    </div>
                                    <div>
                                        <p class="text-xs text-slate-400 mb-0.5">مكان اللجنة</p>
                                        <p class="font-bold text-white">${s.committeeLocation || '---'}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        ${studentInstructions ? `
                            <div class="mt-5 rounded-2xl bg-amber-500/10 border border-amber-500/20 p-4">
                                <div class="flex items-start gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-amber-500/15 flex items-center justify-center flex-shrink-0">
                                        <i class="fas fa-clipboard-list text-amber-300"></i>
                                    </div>
                                    <div>
                                        <p class="text-sm font-bold text-amber-200 mb-1">تعليمات للطالب</p>
                                        <p class="text-sm leading-7 text-slate-200 whitespace-pre-line">${escapeHTML(studentInstructions)}</p>
                                    </div>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            } catch (err) {
                resultsArea.innerHTML = `
                    <div class="glass-card rounded-2xl p-6 text-center animate-fade-in">
                        <i class="fas fa-exclamation-triangle text-4xl text-red-400 mb-3"></i>
                        <p class="text-slate-300">حدث خطأ أثناء البحث، يرجى المحاولة مرة أخرى</p>
                    </div>`;
            }
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Search on Enter key
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchStudent();
        });
    </script>
</body>
</html>
